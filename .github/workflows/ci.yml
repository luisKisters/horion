name: CI

# Tests on pull requests only: grep gates, build and swift test (scripts/verify.sh --fast).
# No run on push to main: what merges was already tested on its pull request.
# Draft pull requests and docs/design-only changes skip the macOS job (a skipped job counts as passed).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request stops the run for the older commit.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -z "$PR" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # A renamed file lists both paths, so moving code into design/ still counts as code.
          files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)')"
          echo "$files"
          # Code unless every changed file is Markdown, under design/ or under artifacts/.
          if grep -qvE '(\.md$|^design/|^artifacts/)' <<<"$files"; then code=true; else code=false; fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  verify:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Grep gates, build, tests
        run: scripts/verify.sh --fast
