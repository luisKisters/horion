name: CI

# Checks every pull request, and every push to main, by running the same
# fast check the developer runs on their Mac: scripts/verify.sh --fast.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels the older run for that pull request.
# Runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify (fast)
    # The newest macOS image GitHub offers. It uses the Xcode that is set as
    # the default on that image, so a new Xcode needs no change here.
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Show the toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run scripts/verify.sh --fast
        run: scripts/verify.sh --fast
