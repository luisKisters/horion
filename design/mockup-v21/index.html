<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horion v21 backgrounds and buttons</title>
<!-- designr starter. Replace the app part (tokens, demo data, app()). Keep the picker part. -->
<style>
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; background: #08080a; color: #d8d8dc; font: 13px/1.4 -apple-system, system-ui, sans-serif; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-align: inherit; padding: 0; }
input { font: inherit; color: inherit; background: none; border: 0; outline: 0; }
#root { display: flex; height: 100%; }
#stage { flex: 1; position: relative; overflow: hidden; }
.shot #picker { display: none; }

/* ---------- picker (outside the app) ---------- */
#picker { width: 380px; flex: none; border-left: 1px solid #222; background: #111113; overflow-y: auto; padding: 18px 18px 84px; }
#picker h1 { font-size: 15px; font-weight: 650; color: #f2f2f4; margin: 0; }
#picker h2 { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: #6c6c74; font-weight: 600; margin: 22px 0 8px; }
#picker .lede { color: #8a8a92; font-size: 12px; margin: 4px 0 14px; }
.pk-btn { padding: 5px 9px; border-radius: 7px; background: #1b1b1f; color: #b4b4bb; font-size: 12px; border: 1px solid #26262b; }
.pk-btn:hover { background: #222227; color: #eee; }
.pk-btn.on { background: #ececf0; color: #111; border-color: #ececf0; }
.pk-scenes { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.pk-notes { padding: 10px 12px; border-radius: 9px; background: #17171a; border: 1px solid #222226; color: #a6a6ae; font-size: 12px; }
.pk-notes ul { margin: 0; padding-left: 15px; }
.pk-ba { display: flex; gap: 4px; align-items: center; margin-bottom: 10px; }
.pk-ba span { color: #6c6c74; font-size: 11px; margin-left: 4px; }
.pk-tog { display: flex; gap: 8px; align-items: center; color: #a6a6ae; font-size: 12px; margin-top: 6px; }
.pk-tog i { width: 24px; height: 14px; border-radius: 7px; background: #2a2a30; position: relative; flex: none; }
.pk-tog i::after { content: ""; position: absolute; left: 2px; top: 2px; width: 10px; height: 10px; border-radius: 50%; background: #8a8a92; transition: transform .15s; }
.pk-tog.on i { background: #ececf0; } .pk-tog.on i::after { transform: translateX(10px); background: #111; }
.pk-audit { margin-top: 8px; color: #8a8a92; font-size: 11.5px; }
.pk-audit b { color: #eee; }
.pk-dec { margin-bottom: 14px; }
.pk-dec > b { color: #f2f2f4; font-size: 12.5px; }
.pk-dec p { color: #8a8a92; font-size: 12px; margin: 3px 0 6px; }
.pk-new { color: #a6a6ae; font-size: 12px; margin: 3px 0 6px; }
.pk-new q { color: #e6e6ea; }
.pk-opt { display: flex; align-items: center; gap: 8px; width: 100%; padding: 5px 8px; border-radius: 7px; color: #b4b4bb; font-size: 12px; }
.pk-opt:hover { background: #1b1b1f; color: #eee; }
.pk-opt.on { color: #f4f4f6; background: #1d1d22; }
.pk-opt .r { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid #4a4a52; flex: none; }
.pk-opt.on .r { border-color: #f4f4f6; background: radial-gradient(#f4f4f6 0 2.5px, transparent 3px); }
.pk-opt .end { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.pk-opt .rec, .pk-opt .lk { font-size: 10.5px; color: #6c6c74; }
.pk-opt .hq { width: 16px; height: 16px; border-radius: 50%; border: 1px solid #3a3a42; color: #8a8a92; font-size: 10px; display: inline-grid; place-items: center; position: relative; }
.pk-opt .hq:hover::after { content: attr(data-help); position: absolute; right: -4px; top: 22px; width: 270px; padding: 8px 10px; border-radius: 8px; background: #26262c; border: 1px solid #3a3a42; color: #e6e6ea; font-size: 11.5px; line-height: 1.45; white-space: normal; z-index: 10; }
.pk-lock { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; padding: 3px 0; color: #8a8a92; }
.pk-lock b { font-weight: 500; color: #c4c4cb; }
.pk-foot { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 22px; }
/* Agentation toolbar: bottom right of the app, not over the picker. */
.agt-host { right: 396px !important; bottom: 16px !important; }
#picker .read { color: #a6a6ae; font-size: 12px; margin: -6px 0 14px; padding-left: 10px; border-left: 2px solid #2a2a30; }
#picks { margin-top: 10px; width: 100%; height: 150px; background: #141417; color: #bdbdc4; border: 1px solid #25252a; border-radius: 8px; padding: 8px; font: 11px/1.45 ui-monospace, Menlo, monospace; resize: vertical; }

/* ---------- preview: crossfade, short glow, alignment guides ---------- */
.ghost { pointer-events: none; z-index: 140; transition: opacity 140ms ease; }
.pvhl { animation: pvpulse 900ms ease-out forwards; }
@keyframes pvpulse { 0% { box-shadow: 0 0 0 0 rgba(90,160,255,.9), 0 0 0 1.5px rgba(90,160,255,.9); } 60% { box-shadow: 0 0 0 8px rgba(90,160,255,0), 0 0 0 1.5px rgba(90,160,255,.9); } 100% { box-shadow: 0 0 0 8px rgba(90,160,255,0), 0 0 0 1.5px transparent; } }
#guides { position: absolute; inset: 0; pointer-events: none; z-index: 150; }
#guides .gv { position: absolute; width: 0; border-left: 1px solid rgba(64, 214, 120, .55); }
#guides .gv.r { border-left-color: rgba(90, 160, 255, .55); }
#guides .gv span { position: absolute; top: 2px; left: 2px; font: 9px ui-monospace, Menlo, monospace; color: rgba(64, 214, 120, .95); background: rgba(0,0,0,.6); padding: 0 2px; }
#guides .bx { position: absolute; outline: 1px solid rgba(255, 70, 90, .95); background: rgba(255, 70, 90, .12); }
#guides .bx span { position: absolute; top: -12px; left: 0; font: 9px ui-monospace, Menlo, monospace; color: #fff; background: rgba(220, 40, 60, .9); padding: 0 3px; white-space: nowrap; }
#guides .ol { position: absolute; outline: 1px dashed rgba(255, 255, 255, .14); }
#guides .legend { position: absolute; left: 12px; bottom: 12px; padding: 8px 10px; border-radius: 8px; background: rgba(10,10,12,.88); border: 1px solid rgba(255,255,255,.12); font: 11px/1.5 -apple-system, system-ui; color: #ddd; }

/* ================= the app: Horion v21, backgrounds, text and buttons ================= */
@font-face { font-family: "Geist"; src: url("../../Sources/Horion/Resources/Fonts/Geist%5Bwght%5D.ttf") format("truetype"); font-weight: 100 900; }
/* Fixed tokens (foundations.md). Backgrounds, the text on them, states and buttons come from tok() as CSS variables:
   every element that is a background gets class on-<level>, which sets --h (its fill), --h-hover, --h-sel, --h-selhover,
   --h-edge, --t1..--t4 (text), --b2* (secondary button), --b1* (primary), --bd* (danger). Children inherit them. */
.desk { --gridV: #1B1B1C; --grid: #212123; --hairStrong: #2A2A2C; --hair: #1C1C1D; --live: #FF6B5F; --onLive: #0B0B0C;
  --r-small: 4.5px; --r-row: 6px; --r-control: 8px; --r-mark: 3px; --btn-h: 26px; --btn-pad: 12px; --font: "Geist", -apple-system, system-ui, sans-serif; }
.paper { --gridV: #EBEBEC; --grid: #E1E1E2; --hairStrong: #DCDCDC; --hair: #E8E8E8; --live: #C9372C; --onLive: #FFFFFF; }
.desk { position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; background: var(--h); color: var(--t1); font: 12px/18px var(--font); display: flex; -webkit-font-smoothing: antialiased; letter-spacing: -.048px; }
[class*="on-"] { background: var(--h); color: var(--t1); }

/* ---------- buttons: one set of kinds, the same on every background ---------- */
.btn { height: var(--btn-h); padding: 0 var(--btn-pad); border-radius: var(--r-control); display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-weight: 500; white-space: nowrap; flex: none; }
.btn.lg { height: var(--btn-lg, var(--btn-h)); }
.btn.k1 { background: var(--b1); color: var(--b1-ink); font-weight: 600; }
.btn.k1:hover, .btn.k1.is-hover { background: var(--b1-hover); }
.btn.k2 { background: var(--b2); box-shadow: inset 0 0 0 1px var(--b2-edge); color: var(--t1); }
.btn.k2:hover, .btn.k2.is-hover { background: var(--b2-hover); }
.btn.k3 { color: var(--t2); }
.btn.k3:hover, .btn.k3.is-hover { background: var(--h-hover); color: var(--t1); }
.btn.k4 { background: var(--bd); color: var(--bd-ink); font-weight: 600; }
.btn.k4:hover, .btn.k4.is-hover { background: var(--bd-hover); }
.btn.k5 { background: var(--b2); box-shadow: inset 0 0 0 1px var(--b2-edge); color: var(--dtext); }
.btn.k5:hover, .btn.k5.is-hover { background: var(--b2-hover); }
.btn.k3.line { box-shadow: inset 0 0 0 1px var(--hairStrong); color: var(--t1); }
.btn.off { pointer-events: none; color: var(--t4) !important; }
.btn.k1.off, .btn.k4.off { background: var(--h-sel) !important; }
.btn.k3.off { background: transparent !important; }
.btn .kc { font-size: 11px; font-weight: 400; padding: 0 4px; min-width: 16px; height: 16px; line-height: 16px; border-radius: 4px; text-align: center; box-shadow: inset 0 0 0 1px var(--h-edge); color: var(--t3); }
.btn.k1 .kc, .btn.k4 .kc { box-shadow: inset 0 0 0 1px color-mix(in srgb, currentColor 30%, transparent); color: inherit; opacity: .7; }
.ib { width: var(--btn-h); height: var(--btn-h); border-radius: var(--r-row); display: inline-grid; place-items: center; color: var(--t3); flex: none; font-size: 12px; }
.ib:hover, .ib.is-hover { background: var(--h-hover); color: var(--t1); }
.pill { background: var(--b1) !important; color: var(--b1-ink) !important; font-weight: 600 !important; }

/* ---------- week ---------- */
.side { width: 236px; flex: none; border-right: 1px solid var(--hair); padding: 56px 12px 0; }
.rc { width: 320px; flex: none; border-left: 1px solid var(--hair); padding: 14px 12px; display: flex; flex-direction: column; }
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
.mm-hd { display: flex; align-items: center; height: 22px; padding-left: 8px; font-weight: 500; }
.mm-hd .yr { color: var(--t3); font-weight: 400; margin-left: 4px; }
.mm-hd .nv { margin-left: auto; display: flex; gap: 2px; }
.mm-hd .ib { width: 22px; height: 22px; }
.mm-wd, .mm-wk { display: grid; grid-template-columns: 20px repeat(7, 1fr); }
.mm-wd { height: 24px; align-items: center; text-align: center; font-size: 11px; color: var(--t3); font-weight: 500; margin-top: 4px; }
.mm-wk { margin-top: 2px; border-radius: var(--r-row); }
.mm-wk.vis { background: var(--h-sel); }
.mm-wn { font-size: 11px; color: var(--t3); display: grid; place-items: center; font-weight: 500; }
.mm-d { height: 24px; display: grid; place-items: center; }
.mm-d b { font-weight: 400; font-size: 11px; font-variant-numeric: tabular-nums; min-width: 24px; height: 24px; border-radius: var(--r-small); display: grid; place-items: center; color: var(--t2); }
.mm-d.out b { color: var(--t3); }
.mm-wk.vis .mm-d b { color: var(--t1); }
.mm-d:hover b, .mm-d.is-hover b { background: var(--h-hover); }
.mm-wk.vis .mm-d:hover b, .mm-wk.vis .mm-d.is-hover b { background: var(--h-selhover); }
.grp { margin-top: 18px; padding: 0 8px; height: 24px; line-height: 24px; color: var(--t3); font-weight: 500; }
.row { display: flex; align-items: center; gap: 10px; height: 26px; padding: 0 8px; border-radius: var(--r-row); width: 100%; }
.row:hover, .row.is-hover { background: var(--h-hover); }
.row.is-sel { background: var(--h-sel); }
.row i { width: 12px; height: 12px; border-radius: var(--r-mark); background: var(--cc); flex: none; }
.row .tm { width: 36px; text-align: right; color: var(--t2); font-size: 11px; font-variant-numeric: tabular-nums; flex: none; }
.row .bar { width: 3px; height: 14px; border-radius: 1.5px; background: var(--cc); flex: none; }
.row .hint { margin-left: auto; color: var(--t3); font-size: 11px; }
.field { height: 28px; border-radius: var(--r-control); display: flex; align-items: center; padding: 0 10px; color: var(--t3); box-shadow: inset 0 0 0 1px var(--h-edge-soft); }
.lead { padding: 12px 8px; }
.lead .lb { font-size: 11px; color: var(--t3); font-weight: 500; } .lead .lb b { color: var(--live); font-weight: 500; margin-left: 6px; }
.lead .t { font-weight: 600; margin-top: 6px; } .lead .m { font-size: 11px; color: var(--t2); }
.lead .btn { width: 100%; margin-top: 10px; }
.foot { margin-top: auto; border-top: 1px solid var(--hair); padding: 12px 8px 2px; }
.foot .ft { color: var(--t3); font-size: 11px; margin-bottom: 8px; }
.foot .bx { display: flex; gap: 6px; align-items: center; }
.foot .sp { flex: 1; }
.tb { height: 48px; display: flex; align-items: center; padding: 0 12px 0 20px; gap: 4px; flex: none; background: transparent; }
.tb h1 { font-size: 15px; line-height: 21px; font-weight: 600; margin: 0; letter-spacing: -.15px; }
.tb h1 span { font-weight: 400; color: var(--t3); }
.tb .sp { flex: 1; }
.seg { display: flex; padding: 2px; border-radius: var(--r-control); margin-right: 12px; height: var(--btn-h); }
.seg button { padding: 0 10px; border-radius: var(--r-row); color: var(--t2); }
.seg button:hover { color: var(--t1); }
.wk { flex: 1; display: grid; grid-template-columns: 56px repeat(7, 1fr); grid-template-rows: 32px auto 1fr; position: relative; background: transparent; }
.dh { display: flex; align-items: center; gap: 6px; padding-left: 8px; color: var(--t3); font-weight: 500; }
.dh .n { font-weight: 500; color: var(--t1); font-variant-numeric: tabular-nums; }
.dh.past .n { color: var(--t2); }
.dh.today { color: var(--t1); }
.dh.today .n { height: 18px; min-width: 20px; padding: 0 5px; border-radius: var(--r-small); display: inline-grid; place-items: center; }
.ad-l { font-size: 11px; color: var(--t3); text-align: right; padding: 4px 8px 0 0; line-height: 20px; border-bottom: 1px solid var(--hairStrong); }
.ad { padding: 3px 3px 4px 2px; display: flex; flex-direction: column; gap: 3px; border-left: 1px solid var(--gridV); border-bottom: 1px solid var(--hairStrong); min-height: 30px; }
.chip { height: 19px; border-radius: var(--r-small); background: color-mix(in oklab, var(--cc) 30%, var(--h)); display: flex; align-items: center; font-weight: 500; padding-left: 7.5px; position: relative; white-space: nowrap; overflow: hidden; }
.chip::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3.5px; background: var(--cc); }
.paper .chip { background: color-mix(in oklab, var(--cc) 20%, var(--h)); }
.col { border-left: 1px solid var(--gridV); position: relative; background-image: repeating-linear-gradient(to bottom, transparent 0 43px, var(--grid) 43px 44px); }
.hl { font-size: 11px; color: var(--t2); text-align: right; padding-right: 8px; font-variant-numeric: tabular-nums; }
.hl div { height: 44px; transform: translateY(-9px); }
.now { position: absolute; left: 0; right: 0; height: 1px; background: color-mix(in srgb, var(--live) 30%, transparent); }
.col.today .now { height: 2px; background: var(--live); }
.col.today .now::before { content: ""; position: absolute; left: -4px; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--live); box-shadow: 0 0 0 1.5px var(--h); }
.ev { position: absolute; left: 2px; right: 3px; border-radius: var(--r-small); background: color-mix(in oklab, var(--cc) 25%, var(--h)); padding: 3px 6px 3px 9.5px; overflow: hidden; }
.ev::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3.5px; background: var(--cc); }
.ev b { font-weight: 500; display: block; } .ev span { color: var(--t2); font-size: 11px; }
.paper .ev { background: color-mix(in oklab, var(--cc) 18%, var(--h)); }
.tcol { background-color: var(--today); }
.menu { position: absolute; width: 220px; padding: 4px; border-radius: 12px; box-shadow: 0 0 0 1px var(--hairStrong), 0 12px 32px rgba(0,0,0,.35); z-index: 5; }
.paper .menu { box-shadow: 0 0 0 1px var(--hairStrong), 0 10px 28px rgba(20,20,30,.14); }
.menu .row { height: 26px; }
.menu .row .kc { margin-left: auto; color: var(--t3); font-size: 11px; }
.menu .row.dz { color: var(--dtext); }
.menu hr { border: 0; border-top: 1px solid var(--hair); margin: 4px 0; }
.dlg { position: absolute; width: 340px; padding: 16px; border-radius: 12px; box-shadow: 0 0 0 1px var(--hairStrong), 0 16px 44px rgba(0,0,0,.4); z-index: 5; }
.paper .dlg { box-shadow: 0 0 0 1px var(--hairStrong), 0 14px 36px rgba(20,20,30,.16); }
.dlg h3 { margin: 0; font-size: 12px; font-weight: 600; } .dlg p { margin: 6px 0 14px; color: var(--t2); }
.dlg .bx { display: flex; gap: 6px; justify-content: flex-end; }

/* ---------- sheet: backgrounds × text, states and buttons ---------- */
.sheet { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 0; overflow: auto; font: 12px/18px var(--font); }
.sheet.one { grid-template-columns: 1fr; }
.sheet > section { padding: 18px 18px 24px; display: flex; flex-direction: column; gap: 10px; }
.sheet h2 { margin: 0; font-size: 15px; line-height: 21px; font-weight: 600; display: flex; align-items: baseline; gap: 10px; }
.sheet h2 small { font-size: 11px; font-weight: 400; color: var(--t3); }
.sum { font-size: 11px; color: var(--t2); } .sum b { color: var(--live); font-weight: 600; } .sum .ok { color: var(--t1); font-weight: 600; }
.lvl { border-radius: 10px; padding: 12px 14px 14px; box-shadow: 0 0 0 1px var(--hair); }
.lvl .lh { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
.lvl .lh b { font-weight: 600; } .lvl .lh span { color: var(--t3); font-size: 11px; }
.lvl .lh code { margin-left: auto; font: 11px ui-monospace, Menlo, monospace; color: var(--t3); }
.tx { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 10px; }
.tx div { line-height: 16px; }
.tx em, .stt em, .bc em, .mx em { display: block; font-style: normal; font-size: 11px; color: var(--t3); font-variant-numeric: tabular-nums; margin-top: 2px; }
.stt { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 10px; }
.stt .sw { height: 26px; border-radius: var(--r-row); display: flex; align-items: center; gap: 6px; padding: 0 8px; white-space: nowrap; overflow: hidden; }
.stt .sw span:nth-child(2) { color: var(--t2); font-size: 11px; } .stt .sw span:nth-child(3) { color: var(--t3); font-size: 11px; }
.stt .cap { font-size: 11px; color: var(--t3); margin-bottom: 3px; }
.bts { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-start; }
.bc { display: flex; flex-direction: column; align-items: flex-start; }
.bad { outline: 2px solid #ff4d4d; outline-offset: 2px; border-radius: 6px; }
em.bd { color: #ff6b6b !important; }
.paper em.bd { color: #c62828 !important; }
.mx { border-collapse: separate; border-spacing: 0 6px; width: 100%; }
.mx th { text-align: left; font-weight: 500; color: var(--t3); font-size: 11px; padding: 0 8px; }
.mx td { padding: 10px 8px; vertical-align: top; }
.mx td:first-child { border-radius: 10px 0 0 10px; width: 110px; } .mx td:last-child { border-radius: 0 10px 10px 0; }
.mx td .nm { font-weight: 600; } .mx td .nm + span { color: var(--t3); font-size: 11px; display: block; }
.mx .trio { display: flex; gap: 6px; margin-bottom: 4px; }
</style>
</head>
<body>
<div id="root"><div id="stage"><div class="desk" id="desk"></div></div><aside id="picker"></aside></div>
<script>
// ================= edit for each round =================
const PRODUCT = 'Horion', VERSION = 'v21', ROUND = 1;
const DESK = { w: 1560, h: 760 };
const SCENES = [['sheet', 'Backgrounds and text'], ['buttons', 'Buttons on every background'], ['week', 'Week, Dark'], ['paper', 'Week, Paper']];
const HOWTO = ['"Backgrounds and text" shows each background with its three text colours, its hover and selected fills and every button, in Dark and Paper. Every pair has its contrast; a red outline means below its floor.',
  '"Buttons on every background" shows each kind at rest, on hover and disabled, on each background.',
  'The week scenes use the same tokens: Today, the view switch, ‹ ›, Join, a menu, a dialog and an editor foot.',
  'Contrast: WCAG 2 ratio and APCA Lc, the floors of foundations.md.'];
const READ = 'Quiet neutral chrome; content and calendar colour lead. Dials: variance 2, motion 2, density 7. A few backgrounds; everything on them is solved, never picked per place.';
const LOCKED = {};
const BEFORE = {};
const DECISIONS = [
  { g: 'Round 1', id: 'levels', name: 'How many background shades', fb: 'in the general design system there are just certain background shades', note: 'Each card on the sheet is one shade. The week scenes show where each is used.', scene: 'sheet', hl: '.lvl', opts: [
    ['four', 'Four: Sidebar, Window, Inset, Raised', 'Menus and dialogs use Window (today pop has the same hex as the canvas anyway). Sidebar = left sidebar and right column; Window = grid, header, menus, dialogs; Inset = search, view-switch track, all-day lane, cards; Raised = fields and popover cards.'],
    ['three', 'Three: Sidebar, Window, Inset', 'Raised goes too: fields sit on Inset like the search field. The fewest shades; fields and cards look the same.'],
    ['five', 'Five, as now (bg, rail, surface, raised, pop)', 'The v11 tokens. Pop is a separate name with the same Dark hex as bg.'],

  const o = ev.target.closest('.pk-opt[data-d]'), blk = ev.target.closest('.pk-dec');
  clearTimeout(PT);
  if (o) PT = setTimeout(() => previewOn(o.dataset.d, o.dataset.v), 90);
  else if (PV && blk && blk.querySelector(`[data-d="${PV.id}"]`)) return;
  else if (PV) PT = setTimeout(() => previewOff(), 140);
});
picker.addEventListener('mouseleave', () => { clearTimeout(PT); previewOff(); });
desk.addEventListener('click', ev => { const t = ev.target.closest('button'); if (t && appClick(t)) { save(); renderPicker(); } });
document.addEventListener('keydown', ev => {
  if (ev.target.closest?.('input, textarea') || ev.metaKey || ev.ctrlKey) return;
  if (ev.key === 'g' || ev.key === 'G') { S.guides = !S.guides; save(); renderPicker(); }
  else if ((ev.key === 'b' || ev.key === 'B') && Object.keys(BEFORE).length) { S.before = !S.before; save(); renderPicker(); }
});
window.addEventListener('resize', () => { fit(); drawGuides(); });
window.addEventListener('hashchange', () => { const id = location.hash.slice(1).split('&')[0]; if (id) preset(id); });
fit();
const scene0 = location.hash.slice(1).split('&')[0];
if (scene0 && SCENES.some(s => s[0] === scene0)) preset(scene0); else renderPicker();
document.fonts?.ready.then(() => { fit(); drawGuides(); });
</script>
<div id="agentation"></div>
<script type="module">
// Agentation (agentation.com): click any element, write a note. The picker toggle turns it on and off.
// It loads from esm.sh, so it needs the network. The mockup works without it. Its notes go into "Copy my picks".
const deps = '?deps=react@18.3.1,react-dom@18.3.1';
let lib = null, root = null, req = 0;
async function set(on, open) {
  const me = ++req;  // turning it off (or on again) while the imports load makes this call stale
  if (!on) { root?.unmount(); root = null; agtMsg('Off.'); return; }
  if (root) return;
  agtMsg('Loading from esm.sh …');
  try {
    lib = lib || await Promise.all([import('https://esm.sh/react@18.3.1'), import('https://esm.sh/react-dom@18.3.1/client' + deps), import('https://esm.sh/agentation@3.1.2' + deps)]);
    if (me !== req) return;
    const [React, { createRoot }, { Agentation }] = lib;
    root = createRoot(document.getElementById('agentation'));
    root.render(React.createElement(Agentation, {
      appName: `${PRODUCT} ${VERSION} round ${ROUND}`, className: 'agt-host',
      identifyingAttributes: ['data-area', 'data-k', 'data-d', 'data-v', 'data-go', 'data-open'],
      onAnnotationAdd: NOTES.set, onAnnotationUpdate: NOTES.set, onAnnotationDelete: NOTES.del, onAnnotationsClear: NOTES.clear,
    }));
    agtMsg('On. ⌘⇧F or the button at the bottom right of the app opens it. Then click an element and write.');
    // After a click on the toggle, open the toolbar at once.
    if (open) setTimeout(() => document.dispatchEvent(new KeyboardEvent('keydown', { key: 'F', code: 'KeyF', metaKey: true, shiftKey: true, bubbles: true })), 250);
  } catch (e) { if (me !== req) return; root = null; agtMsg('Did not load (no network?). The mockup works without it.'); console.info('Agentation did not load.', e); }
}
window.AGT = { set };
if (!shot) set(S.agt !== false); else agtMsg('');
</script>
