<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horion v21 · panel pickers</title>
<style>
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; background: #08080a; color: #d8d8dc; font: 13px/1.4 -apple-system, system-ui, sans-serif; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-align: inherit; padding: 0; }
input { font: inherit; color: inherit; background: none; border: 0; outline: 0; }
#root { display: flex; height: 100%; }
#stage { flex: 1; position: relative; overflow: hidden; }
.shot #picker { display: none; }

/* ---------- picker (outside the app) ---------- */
#picker { width: 380px; flex: none; border-left: 1px solid #222; background: #111113; overflow-y: auto; padding: 18px 18px 84px; }
#picker h1 { font-size: 15px; font-weight: 650; color: #f2f2f4; margin: 0; }
#picker h2 { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: #6c6c74; font-weight: 600; margin: 22px 0 8px; }
#picker .lede { color: #8a8a92; font-size: 12px; margin: 4px 0 14px; }
.pk-btn { padding: 5px 9px; border-radius: 7px; background: #1b1b1f; color: #b4b4bb; font-size: 12px; border: 1px solid #26262b; }
.pk-btn:hover { background: #222227; color: #eee; }
.pk-btn.on { background: #ececf0; color: #111; border-color: #ececf0; }
.pk-scenes { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.pk-notes { padding: 10px 12px; border-radius: 9px; background: #17171a; border: 1px solid #222226; color: #a6a6ae; font-size: 12px; }
.pk-notes ul { margin: 0; padding-left: 15px; }
.pk-ba { display: flex; gap: 4px; align-items: center; margin-bottom: 10px; }
.pk-ba span { color: #6c6c74; font-size: 11px; margin-left: 4px; }
.pk-tog { display: flex; gap: 8px; align-items: center; color: #a6a6ae; font-size: 12px; margin-top: 6px; }
.pk-tog i { width: 24px; height: 14px; border-radius: 7px; background: #2a2a30; position: relative; flex: none; }
.pk-tog i::after { content: ""; position: absolute; left: 2px; top: 2px; width: 10px; height: 10px; border-radius: 50%; background: #8a8a92; transition: transform .15s; }
.pk-tog.on i { background: #ececf0; } .pk-tog.on i::after { transform: translateX(10px); background: #111; }
.pk-audit { margin-top: 8px; color: #8a8a92; font-size: 11.5px; }
.pk-audit b { color: #eee; }
.pk-dec { margin-bottom: 14px; }
.pk-dec > b { color: #f2f2f4; font-size: 12.5px; }
.pk-dec p { color: #8a8a92; font-size: 12px; margin: 3px 0 6px; }
.pk-new { color: #a6a6ae; font-size: 12px; margin: 3px 0 6px; }
.pk-new q { color: #e6e6ea; }
.pk-opt { display: flex; align-items: center; gap: 8px; width: 100%; padding: 5px 8px; border-radius: 7px; color: #b4b4bb; font-size: 12px; }
.pk-opt:hover { background: #1b1b1f; color: #eee; }
.pk-opt.on { color: #f4f4f6; background: #1d1d22; }
.pk-opt .r { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid #4a4a52; flex: none; }
.pk-opt.on .r { border-color: #f4f4f6; background: radial-gradient(#f4f4f6 0 2.5px, transparent 3px); }
.pk-opt .end { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.pk-opt .rec, .pk-opt .lk { font-size: 10.5px; color: #6c6c74; }
.pk-opt .hq { width: 16px; height: 16px; border-radius: 50%; border: 1px solid #3a3a42; color: #8a8a92; font-size: 10px; display: inline-grid; place-items: center; position: relative; }
.pk-opt .hq:hover::after { content: attr(data-help); position: absolute; right: -4px; top: 22px; width: 270px; padding: 8px 10px; border-radius: 8px; background: #26262c; border: 1px solid #3a3a42; color: #e6e6ea; font-size: 11.5px; line-height: 1.45; white-space: normal; z-index: 10; }
.pk-lock { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; padding: 3px 0; color: #8a8a92; }
.pk-lock b { font-weight: 500; color: #c4c4cb; }
.pk-foot { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 22px; }
/* Agentation toolbar: bottom right of the app, not over the picker. */
.agt-host { right: 396px !important; bottom: 16px !important; }
#picker .read { color: #a6a6ae; font-size: 12px; margin: -6px 0 14px; padding-left: 10px; border-left: 2px solid #2a2a30; }
#picks { margin-top: 10px; width: 100%; height: 150px; background: #141417; color: #bdbdc4; border: 1px solid #25252a; border-radius: 8px; padding: 8px; font: 11px/1.45 ui-monospace, Menlo, monospace; resize: vertical; }

/* ---------- preview: crossfade, short glow, alignment guides ---------- */
.ghost { pointer-events: none; z-index: 140; transition: opacity 140ms ease; }
.pvhl { animation: pvpulse 900ms ease-out forwards; }
@keyframes pvpulse { 0% { box-shadow: 0 0 0 0 rgba(90,160,255,.9), 0 0 0 1.5px rgba(90,160,255,.9); } 60% { box-shadow: 0 0 0 8px rgba(90,160,255,0), 0 0 0 1.5px rgba(90,160,255,.9); } 100% { box-shadow: 0 0 0 8px rgba(90,160,255,0), 0 0 0 1.5px transparent; } }
#guides { position: absolute; inset: 0; pointer-events: none; z-index: 150; }
#guides .gv { position: absolute; width: 0; border-left: 1px solid rgba(64, 214, 120, .55); }
#guides .gv.r { border-left-color: rgba(90, 160, 255, .55); }
#guides .gv span { position: absolute; top: 2px; left: 2px; font: 9px ui-monospace, Menlo, monospace; color: rgba(64, 214, 120, .95); background: rgba(0,0,0,.6); padding: 0 2px; }
#guides .bx { position: absolute; outline: 1px solid rgba(255, 70, 90, .95); background: rgba(255, 70, 90, .12); }
#guides .bx span { position: absolute; top: -12px; left: 0; font: 9px ui-monospace, Menlo, monospace; color: #fff; background: rgba(220, 40, 60, .9); padding: 0 3px; white-space: nowrap; }
#guides .ol { position: absolute; outline: 1px dashed rgba(255, 255, 255, .14); }
#guides .legend { position: absolute; left: 12px; bottom: 12px; padding: 8px 10px; border-radius: 8px; background: rgba(10,10,12,.88); border: 1px solid rgba(255,255,255,.12); font: 11px/1.5 -apple-system, system-ui; color: #ddd; }

/* ================= the app: Horion v21 ================= */
@font-face { font-family: Geist; src: url("../../Sources/Horion/Resources/Fonts/Geist%5Bwght%5D.ttf") format("truetype"); font-weight: 100 900; }
/* Tokens (Theme.swift InkRGB.dark, Dim, Radius). Every value in the app CSS below is a token. */
.desk { --bg: #0B0B0C; --rail: #070708; --bg1: #151516; --bg2: #1D1D1E; --bg3: #2A2A2C; --pop: #0B0B0C;
  --fg: #EBEBED; --fg2: #CCCCCE; --fg3: #A8A8AA; --fg4: #4E4E50; --hover: #161617; --sel: #1E1E1F; --popHover: #1D1D1E;
  --grid: #212123; --gridV: #1B1B1C; --hair: #1C1C1D; --hair2: #2A2A2C; --live: #FF6B5F; --focus: #6E9BF5; --ok: #6CC58A; --warn: #E5B44A; --danger: #FF7B72;
  --font: Geist, -apple-system, system-ui, sans-serif; --fs-title: 15px; --fs-ui: 12px; --fs-small: 11px;
  --w-side: 236px; --w-panel: 320px; --h-tool: 48px; --h-dayhead: 32px; --gutter: 56px; --h-hour: 46px;
  --h-row: 28px; --h-field: 32px; --r-ev: 4.5px; --r-row: 6px; --r-ctl: 8px; --r-pop: 10px;
  --s-xs: 4px; --s-s: 8px; --s-m: 12px; --s-l: 16px;
  --c-personal: #5B8DEF; --c-family: #E8804A; --c-tasks: #A8A8AA; --c-run: #D9B24A; --c-work: #4FA3E0; --c-flat: #3FB46A; }
.desk { position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; background: var(--bg); color: var(--fg); font: var(--fs-ui)/1.4 var(--font); display: flex; -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
.desk button { font: inherit; }
.desk .mono { font-variant-numeric: tabular-nums; }
.desk svg.i { width: 16px; height: 16px; fill: none; stroke: var(--fg3); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.desk svg.i.s { width: 14px; height: 14px; }
/* sidebar */
.side { width: var(--w-side); flex: none; background: var(--rail); border-right: 1px solid var(--hair); padding: var(--s-s) var(--s-l); display: flex; flex-direction: column; }
.lights { display: flex; gap: 8px; height: 32px; align-items: center; }
.lights i { width: 12px; height: 12px; border-radius: 50%; background: #FF5F57; } .lights i:nth-child(2) { background: #FEBC2E; } .lights i:nth-child(3) { background: #28C840; }
.mm-title { display: flex; align-items: center; justify-content: space-between; height: var(--h-row); margin-top: var(--s-s); font-weight: 500; }
.mm-title span { color: var(--fg3); font-weight: 400; }
.smm { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: var(--fs-small); row-gap: 2px; margin-top: var(--s-xs); }
.smm b { font-weight: 400; color: var(--fg3); height: 22px; line-height: 22px; }
.smm i { font-style: normal; height: 24px; line-height: 24px; color: var(--fg2); border-radius: var(--r-row); }
.smm i.o { color: var(--fg4); } .smm i.wk { background: var(--bg1); } .smm i.t { background: var(--fg); color: var(--bg); font-weight: 600; }
.grp { color: var(--fg3); font-weight: 500; margin: var(--s-l) 0 var(--s-xs); height: var(--h-row); line-height: var(--h-row); }
.cal { display: flex; align-items: center; gap: var(--s-s); height: 26px; color: var(--fg); }
.cal i { width: 12px; height: 12px; border-radius: 3px; flex: none; }
.side .foot { margin-top: auto; color: var(--fg2); height: var(--h-row); line-height: var(--h-row); }
/* center */
.center { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.tool { height: var(--h-tool); flex: none; display: flex; align-items: center; padding: 0 var(--s-l); gap: var(--s-s); }
.tool h1 { font-size: var(--fs-title); font-weight: 600; margin: 0; } .tool h1 span { color: var(--fg3); font-weight: 400; }
.seg { margin-left: auto; display: flex; background: var(--bg1); border-radius: var(--r-ctl); padding: 2px; }
.seg span { padding: 0 10px; height: 24px; line-height: 24px; border-radius: var(--r-row); color: var(--fg2); }
.seg span.on { background: var(--fg); color: var(--bg); font-weight: 500; }
.tbtn { height: 28px; padding: 0 10px; line-height: 28px; border-radius: var(--r-ctl); background: var(--bg1); color: var(--fg); }
.dayhead { display: grid; grid-template-columns: var(--gutter) repeat(7, 1fr); height: var(--h-dayhead); align-items: center; flex: none; }
.dayhead div { padding-left: var(--s-s); color: var(--fg2); } .dayhead b { color: var(--fg); font-weight: 500; margin-left: 4px; }
.dayhead .td b { background: var(--fg); color: var(--bg); border-radius: 4px; padding: 0 4px; font-weight: 600; }
.allday { display: grid; grid-template-columns: var(--gutter) repeat(7, 1fr); gap: 0; padding: 2px 0 6px; border-bottom: 1px solid var(--hair2); flex: none; }
.allday .lab { color: var(--fg3); font-size: var(--fs-small); text-align: right; padding-right: var(--s-s); }
.chipev { margin: 1px 3px; height: 20px; line-height: 20px; padding: 0 6px; border-radius: var(--r-ev); background: color-mix(in oklab, var(--c) 30%, var(--bg)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
.body { flex: 1; position: relative; overflow: hidden; display: grid; grid-template-columns: var(--gutter) repeat(7, 1fr); }
.hours { position: relative; }
.hours span { position: absolute; right: var(--s-s); font-size: var(--fs-small); color: var(--fg2); transform: translateY(-50%); }
.col { position: relative; border-left: 1px solid var(--gridV); }
.hl { position: absolute; left: 0; right: 0; border-top: 1px solid var(--grid); }
.ev { position: absolute; left: 3px; right: 4px; border-radius: var(--r-ev); padding: 3px 6px 3px 8px; background: color-mix(in oklab, var(--c) 24%, var(--bg)); overflow: hidden; }
.ev::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3.5px; background: var(--c); }
.ev b { display: block; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ev span { color: var(--fg2); font-size: var(--fs-small); }
.ev.sel { box-shadow: 0 0 0 1.5px var(--bg), 0 0 0 3px var(--c); }
.now { position: absolute; left: var(--gutter); right: 0; border-top: 1px solid var(--live); opacity: .5; }
.nowlab { position: absolute; left: 4px; background: var(--live); color: var(--bg); font-size: var(--fs-small); padding: 0 4px; border-radius: 4px; transform: translateY(-50%); font-weight: 500; }
/* panel */
.panel { width: var(--w-panel); flex: none; border-left: 1px solid var(--hair); background: var(--bg); display: flex; flex-direction: column; position: relative; }
.search { margin: var(--s-s) var(--s-m) var(--s-s); height: var(--h-field); border-radius: var(--r-ctl); background: var(--bg1); display: flex; align-items: center; gap: var(--s-s); padding: 0 6px; color: var(--fg3); }
.search kbd { margin-left: auto; font: var(--fs-small) var(--font); border: 1px solid var(--hair2); border-radius: 4px; padding: 0 4px; }
.pb { padding: var(--s-s) var(--s-m) 0 var(--s-m); position: relative; }
.prow { display: flex; align-items: center; gap: var(--s-m); min-height: var(--h-field); position: relative; }
.prow > svg.i { margin-top: 0; }
.prow.top { align-items: flex-start; } .prow.top > svg.i { margin-top: 8px; }
.prow .pad { width: 16px; flex: none; }
.ttl { display: flex; align-items: center; gap: var(--s-m); height: 36px; }
.ttl .bar { width: 3.5px; height: 22px; border-radius: 2px; background: var(--c-flat); margin: 0 6px; }
.ttl b { font-size: var(--fs-title); font-weight: 600; flex: 1; }
.fld { background: transparent; border: 0; color: var(--fg); font: var(--fs-ui) var(--font); height: 24px; padding: 0 6px; margin-left: -6px; border-radius: var(--r-row); outline: none; min-width: 0; font-variant-numeric: tabular-nums; }
.fld:hover { background: var(--hover); }
.fld:focus { background: var(--bg1); box-shadow: inset 0 0 0 1px var(--fg3); }
.fld.d { width: 92px; } .fld.t { width: 48px; text-align: center; margin-left: 6px; }
.arr { color: var(--fg3); }
.dur { flex: none; margin-left: auto; color: var(--fg3); font-size: var(--fs-small); }
.anc { position: relative; display: inline-flex; }
.tog { width: 26px; height: 16px; border-radius: 8px; background: var(--bg3); position: relative; flex: none; border: 0; padding: 0; cursor: pointer; }
.tog::after { content: ""; position: absolute; left: 2px; top: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--fg3); }
.tog.on { background: var(--fg); } .tog.on::after { left: 12px; background: var(--bg); }
.lbtn { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 6px; margin-left: -6px; border-radius: var(--r-row); border: 0; background: none; color: var(--fg); cursor: pointer; white-space: nowrap; outline: none; }
.lbtn:hover { background: var(--hover); }
.lbtn:focus-visible, .lbtn.open { box-shadow: 0 0 0 1.5px var(--focus); }
.lbtn.ph { color: var(--fg2); }
.lbtn .sub { color: var(--fg3); }
.dim { color: var(--fg3); }
.guest { display: flex; align-items: center; gap: var(--s-s); height: 26px; }
.guest .st { width: 14px; text-align: center; font-size: var(--fs-small); }
.st.y { color: var(--ok); } .st.m { color: var(--warn); } .st.n { color: var(--danger); } .st.w { color: var(--fg3); }
.gfield { height: var(--h-field); border: 1px solid var(--hair2); border-radius: var(--r-ctl); padding: 0 var(--s-s); margin: var(--s-xs) 0 0 calc(-1 * var(--s-s) - 1px); width: calc(100% + 1px); background: none; color: var(--fg); font: var(--fs-ui) var(--font); outline: none; }
.gfield:focus { border-color: var(--fg3); }
.gfield[readonly] { color: var(--fg4); }
.why { display: flex; align-items: center; gap: var(--s-s); color: var(--fg3); font-size: var(--fs-small); margin: var(--s-xs) 0 0 0; }
.why button, .card button { border: 0; background: none; color: var(--focus); cursor: pointer; padding: 0; font-size: var(--fs-small); }
.card { margin: var(--s-xs) 0 0 -12px; padding: var(--s-s) var(--s-m); border-radius: var(--r-ctl); background: var(--bg1); color: var(--fg2); }
.card b { display: block; color: var(--fg); font-weight: 500; }
.going { display: flex; background: var(--bg1); border-radius: var(--r-ctl); padding: 2px; } .going span { padding: 0 10px; height: 22px; line-height: 22px; color: var(--fg3); border-radius: var(--r-row); } .going span.on { background: var(--bg3); color: var(--fg); }
.join { margin: var(--s-xs) 0 0 28px; height: var(--h-field); border-radius: var(--r-ctl); background: var(--fg); color: var(--bg); display: grid; place-items: center; font-weight: 500; }
.gap { height: var(--s-s); }
.toast { position: absolute; left: var(--s-m); right: var(--s-m); bottom: var(--s-m); background: var(--bg2); border: 1px solid var(--hair2); border-radius: var(--r-ctl); padding: var(--s-s) var(--s-m); color: var(--fg2); z-index: 60; }
/* pickers */
.pop { position: absolute; z-index: 50; background: var(--pop); border: 1px solid var(--hair2); border-radius: var(--r-pop); padding: var(--s-xs); box-shadow: 0 12px 32px rgba(0,0,0,.5); outline: none; }
.pop.under { top: calc(100% + 4px); left: -13px; }
.pop.right { top: calc(100% + 4px); right: -4px; }
.pop.sheet { position: fixed; }
.pk-left .pop.pick { right: auto; }
.pk-inline .anc:has(> .pop.pick) { display: contents; }
.pk-inline .prow:has(.pop.pick) { flex-wrap: wrap; row-gap: 0; }
.pk-inline .prow:has(.pop.pick)::after { content: ''; flex-basis: 100%; order: 98; }
.pk-inline .pop.pick { position: static; order: 99; flex: none; margin: var(--s-xs) 0 var(--s-s) calc(16px + var(--s-m) - 6px - 13px); box-shadow: none; }
.pk-inline .pop.pick .plist { max-height: 180px !important; }

.plist { max-height: 252px; overflow: auto; scrollbar-width: none; }
.mi { display: flex; align-items: center; gap: var(--s-s); height: 28px; padding: 0 var(--s-s); border-radius: var(--r-row); white-space: nowrap; cursor: pointer; color: var(--fg); }
.mi:hover { background: var(--hover); }
.mi.act { background: var(--popHover); }
.mi .ck { width: 14px; flex: none; color: var(--fg2); font-size: var(--fs-small); }
.mi .len { margin-left: auto; text-align: right; padding-left: var(--s-m); color: var(--fg3); font-size: var(--fs-small); overflow: hidden; text-overflow: ellipsis; }
.mi .lead { color: var(--fg3); font-size: var(--fs-small); width: 40px; flex: none; }
.mi .off { color: var(--fg3); width: 76px; flex: none; }
.mi .zn { overflow: hidden; text-overflow: ellipsis; } .mi .zn em { font-style: normal; color: var(--fg3); }
.sep { height: 1px; background: var(--hair2); margin: var(--s-xs) var(--s-s); }
.keys { display: flex; gap: var(--s-m); flex-wrap: wrap; padding: var(--s-xs) var(--s-s) 2px; color: var(--fg3); font-size: var(--fs-small); }
.zs { display: flex; align-items: center; gap: var(--s-s); height: var(--h-field); padding: 0 6px; border-bottom: 1px solid var(--hair2); margin-bottom: var(--s-xs); }
.zs input { flex: 1; background: none; border: 0; outline: none; color: var(--fg); font: var(--fs-ui) var(--font); }
.empty { padding: var(--s-s); color: var(--fg3); }
.pmm { width: 228px; padding: 2px var(--s-xs); }
.pmm .h { display: flex; align-items: center; justify-content: space-between; height: var(--h-row); font-weight: 500; }
.pmm .h button { width: 24px; height: 24px; border-radius: var(--r-row); border: 0; background: none; color: var(--fg2); cursor: pointer; }
.pmm .h button:hover { background: var(--hover); }
.pmm .g { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: var(--fs-small); row-gap: 2px; }
.pmm .g b { font-weight: 400; color: var(--fg3); height: 22px; line-height: 22px; }
.pmm .g i { font-style: normal; height: 26px; line-height: 26px; border-radius: var(--r-row); cursor: pointer; color: var(--fg2); }
.pmm .g i:hover { background: var(--hover); }
.pmm .g i.o { color: var(--fg4); } .pmm .g i.t { color: var(--live); font-weight: 600; } .pmm .g i.c { background: var(--fg); color: var(--bg); font-weight: 600; } .pmm .g i.k { box-shadow: inset 0 0 0 1.5px var(--focus); }
.crow { display: flex; align-items: center; gap: var(--s-s); height: 30px; padding: 0 var(--s-s); border-radius: var(--r-row); cursor: pointer; }
.crow.act { background: var(--popHover); }
.crow .k { color: var(--fg3); width: 44px; flex: none; }
.crow .v { flex: 1; text-align: center; }
.crow button { width: 22px; height: 22px; border: 0; background: none; color: var(--fg2); border-radius: var(--r-row); cursor: pointer; }

picker.addEventListener('click', ev => {
  const t = ev.target.closest('button'); if (!t) return;
  const a = t.dataset.a;
  if (t.dataset.scene) return preset(t.dataset.scene);
  if (t.dataset.d) { clearTimeout(PT); PV = null; S.c[t.dataset.d] = t.dataset.v; S.before = false; }
  else if (a === 'before' || a === 'after') S.before = a === 'before';
  else if (a === 'hover') S.hover = S.hover === false;
  else if (a === 'guides') S.guides = !S.guides;
  else if (a === 'agt') { S.agt = S.agt === false; save(); window.AGT?.set(S.agt, true); }
  else if (a === 'unlock') S.unlock = !S.unlock;
  else if (a === 'copy') { navigator.clipboard?.writeText(picksText()); t.textContent = 'Copied'; return; }
  else if (a === 'reset') { DECISIONS.forEach(d => { S.c[d.id] = d.lock ? LOCKED[d.id] : d.opts[0][0]; }); S.before = false; }
  else if (a === 'demo') A = fresh();
  else return;
  save(); renderPicker();
});
// Hover intent: show an option after 90 ms. The gaps inside one decision keep the preview, so nothing flickers.
let PT = null;
picker.addEventListener('mouseover', ev => {
  const o = ev.target.closest('.pk-opt[data-d]'), blk = ev.target.closest('.pk-dec');
  clearTimeout(PT);
  if (o) PT = setTimeout(() => previewOn(o.dataset.d, o.dataset.v), 90);
  else if (PV && blk && blk.querySelector(`[data-d="${PV.id}"]`)) return;
  else if (PV) PT = setTimeout(() => previewOff(), 140);
});
picker.addEventListener('mouseleave', () => { clearTimeout(PT); previewOff(); });
document.getElementById('desk').addEventListener('click', ev => { const t = ev.target.closest('button'); if (t && appClick(t)) { save(); renderPicker(); } });
document.addEventListener('keydown', ev => {
  if (ev.target.closest?.('input, textarea') || ev.metaKey || ev.ctrlKey) return;
  if (ev.key === 'g' || ev.key === 'G') { S.guides = !S.guides; save(); renderPicker(); }
  else if ((ev.key === 'b' || ev.key === 'B') && Object.keys(BEFORE).length) { S.before = !S.before; save(); renderPicker(); }
});
window.addEventListener('resize', () => { fit(); drawGuides(); });
window.addEventListener('hashchange', () => { const id = location.hash.slice(1).split('&')[0]; if (id) preset(id); });
fit();
const scene0 = location.hash.slice(1).split('&')[0];
if (scene0 && SCENES.some(s => s[0] === scene0)) preset(scene0); else renderPicker();
document.fonts?.ready.then(() => { fit(); drawGuides(); });
</script>
<div id="agentation"></div>
<script type="module">
// Agentation (agentation.com): click any element, write a note. The picker toggle turns it on and off.
// It loads from esm.sh, so it needs the network. The mockup works without it. Its notes go into "Copy my picks".
const deps = '?deps=react@18.3.1,react-dom@18.3.1';
let lib = null, root = null;
async function set(on, open) {
  if (!on) { root?.unmount(); root = null; agtMsg('Off.'); return; }
  if (root) return;
  agtMsg('Loading from esm.sh …');
  try {
    lib = lib || await Promise.all([import('https://esm.sh/react@18.3.1'), import('https://esm.sh/react-dom@18.3.1/client' + deps), import('https://esm.sh/agentation@3.1.2' + deps)]);
    const [React, { createRoot }, { Agentation }] = lib;
    root = createRoot(document.getElementById('agentation'));
    root.render(React.createElement(Agentation, {
      appName: `${PRODUCT} ${VERSION} round ${ROUND}`, className: 'agt-host',
      identifyingAttributes: ['data-area', 'data-k', 'data-d', 'data-v', 'data-go', 'data-open'],
      onAnnotationAdd: NOTES.set, onAnnotationUpdate: NOTES.set, onAnnotationDelete: NOTES.del, onAnnotationsClear: NOTES.clear,
    }));
    agtMsg('On. ⌘⇧F or the button at the bottom right of the app opens it. Then click an element and write.');
    // After a click on the toggle, open the toolbar at once.
    if (open) setTimeout(() => document.dispatchEvent(new KeyboardEvent('keydown', { key: 'F', code: 'KeyF', metaKey: true, shiftKey: true, bubbles: true })), 250);
  } catch (e) { root = null; agtMsg('Did not load (no network?). The mockup works without it.'); console.info('Agentation did not load.', e); }
}
window.AGT = { set };
if (!shot) set(S.agt !== false); else agtMsg('');
</script>
